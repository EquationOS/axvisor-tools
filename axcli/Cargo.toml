[package]
name = "axcli"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["deps/acpi-tables"]

[dependencies]
clap = { version = "4.5.4", features = ["derive"] }
libc = "0.2.154"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.145"
toml = "0.8.14"
env_logger = "0.11.3"
log = "0.4.21"
goblin = "0.10.0"
lazyinit = "0.2"
axerrno = "0.1.0"
sc = "0.2.7"

equation_defs = { git = "https://github.com/EquationOS/equation_defs.git" }
linux-libc-auxv = { git = "https://github.com/EquationOS/linux-libc-auxv.git" }

memory_addr = "0.3"
page_table_multiarch = "0.5"
axhvc = { git = "https://github.com/arceos-hypervisor/axhvc.git" }
pi_memory_layout = { git = "https://github.com/EquationOS/pi-memory-layout.git" }

# For Boot Linux microVM
linux-loader = "0.13.2"
vm-allocator = { version = "0.1.3", features = ["serde"] }
vm-memory = { version = "0.17.1", features = [
  "backend-mmap",
  "backend-bitmap",
] }
bitvec = { version = "1.0.1", features = ["atomic", "serde"] }
thiserror = "2.0.17"
displaydoc = "0.2.5"
acpi_tables = { path = "./deps/acpi-tables" }
zerocopy = { version = "0.8.31" }
kvm-bindings = { version = "0.14.0", features = ["fam-wrappers", "serde"] }


[patch."https://github.com/arceos-hypervisor/axhvc.git"]
axhvc = { path = "../../../crates/axhvc" }

[patch."https://github.com/EquationOS/pi-memory-layout.git"]
pi_memory_layout = { path = "../../../crates/pi_memory_layout" }

[patch."https://github.com/EquationOS/equation_defs.git"]
equation_defs = { path = "../../../crates/equation_defs" }

[patch."https://github.com/arceos-org/x86_uintr.git"]
x86_uintr = { path = "../../../crates/x86_uintr" }

[patch.crates-io]
memory_addr = { path = "../../../crates/memory_addr/memory_addr" }
bitmaps = { path = "../../../crates/bitmaps" }
page_table_multiarch = { path = "../../../crates/page_table_multiarch/page_table_multiarch" }

[build-dependencies]
bindgen = "0.72"
